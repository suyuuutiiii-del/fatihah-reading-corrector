name: Build PDF Page Equalizer Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pdf-page-equalizer/android/**'
      - '.github/workflows/build-pdf-equalizer-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Bundle PDF libraries into the app
        run: |
          ASSETS='pdf-page-equalizer/android/app/src/main/assets'
          mkdir -p "$ASSETS"
          curl -fL 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js' -o "$ASSETS/pdf.min.js"
          curl -fL 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js' -o "$ASSETS/pdf.worker.min.js"
          curl -fL 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js' -o "$ASSETS/pdf-lib.min.js"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK and release bundle
        run: gradle -p pdf-page-equalizer/android clean assembleDebug bundleRelease --stacktrace

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Page-Equalizer-debug-APK
          path: pdf-page-equalizer/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Page-Equalizer-release-AAB-unsigned
          path: pdf-page-equalizer/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
