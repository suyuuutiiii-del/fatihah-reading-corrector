name: Deploy Igboland App to Cloudflare
on:
  push:
    branches: [main]
    paths:
      - 'igboland/index.html'
      - 'igboland-worker/**'
      - '.github/workflows/deploy-igboland-cloudflare.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.133.0'
          workingDirectory: igboland-worker
          command: deploy --temporary
