name: Enable AL-BUSHRA Igbo
on:
  push:
    paths:
      - '.github/workflows/enable-albushra-igbo.yml'
permissions:
  contents: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Igbo selector and module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('al-bushra.html')
          s=p.read_text()
          if '<option value="ig">Igbo</option>' not in s:
              s=s.replace('<option value="ha">Hausa</option>', '<option value="ha">Hausa</option><option value="ig">Igbo</option>')
          if '<script src="al-bushra-igbo.js"></script>' not in s:
              s=s.replace('<script src="al-bushra-i18n.js"></script>', '<script src="al-bushra-i18n.js"></script>\n<script src="al-bushra-igbo.js"></script>')
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add al-bushra.html
          git diff --cached --quiet || git commit -m "Add Igbo to AL-BUSHRA language selector"
          git push