<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#073e2c"><title>FARD Organisation & Safety Admin</title>
<style>:root{--g:#0b5a3c;--gd:#073e2c;--red:#9d2c2c;--gold:#c9a44a;--ink:#142019;--muted:#68746c;--line:#dfe6e1}*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.top{display:flex;gap:10px;align-items:center;padding:12px 14px;background:#fff}.top img{width:44px}.top a{margin-left:auto;color:var(--g);font-weight:850;text-decoration:none}.wrap{width:min(1100px,94%);margin:auto}.hero{margin:20px 0;padding:22px;border-radius:20px;background:linear-gradient(135deg,var(--gd),var(--g));color:#fff}.panel,.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:13px 0}.row,.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:9px 11px;background:var(--g);color:#fff;font-weight:850}.btn.secondary{background:#fff;color:var(--g);border:1px solid #b9c8bf}.btn.warn{background:#fff6e7;color:#6f5200;border:1px solid #e7cd92}.btn.danger{background:#fff0f0;color:var(--red);border:1px solid #e8bcbc}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-weight:850}.tab.active{background:var(--gd);color:#fff}.badge{display:inline-block;border-radius:999px;padding:5px 8px;background:#e9f3ed;color:var(--g);font-size:.72rem;font-weight:900}.gold{background:#fff4d6;color:#6f5200}.red{background:#fff0f0;color:var(--red)}.muted{color:var(--muted)}.private{background:#eef3fb;border-left:4px solid #315b9b;padding:10px;border-radius:8px}.hide{display:none}input{width:100%;padding:11px;border:1px solid #ccd5ce;border-radius:10px;font:inherit}.msg{padding:10px;margin:8px 0}footer{text-align:center;color:var(--muted);padding:25px}</style></head><body>
<header class="top"><img src="al-bushra/icon.svg" alt=""><strong>FARD · Organisation & Safety Admin</strong><a href="fard-administration.html">← Administration</a><a href="fard-admin.html">Matching Admin</a></header><main class="wrap"><section class="hero"><h1>Trust Administration</h1><p>Approve institutional verifiers and review safeguarding incidents separately from routine matching.</p></section><section class="panel"><div class="row"><input id="token" type="password" placeholder="Private Admin Token"><button id="connect" class="btn">Connect</button></div><div id="msg"></div></section><div id="work" class="hide"><div class="tabs"><button class="tab active" data-tab="org">Organisations</button><button class="tab" data-tab="inc">Incidents</button></div><section id="orgPanel" class="panel"><h2>Organisation applications</h2><div id="orgs"></div></section><section id="incPanel" class="panel hide"><h2>Safeguarding incidents</h2><div id="incs"></div></section></div></main><footer>AL-BUSHRA · FARD trust administration</footer><script>
const API='https://albushra-community.suyuuutiiii.workers.dev';let T=sessionStorage.getItem('albushra_admin_token')||'',O=[],I=[];token.value=T;const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function api(p,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+T,...(o.body?{'Content-Type':'application/json'}:{})};const r=await fetch(API+p,o);const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}function note(x){msg.textContent=x}
connect.onclick=async()=>{T=token.value.trim();sessionStorage.setItem('albushra_admin_token',T);try{await api('/api/admin/health');work.classList.remove('hide');await load();note('Connected.')}catch(e){work.classList.add('hide');note(e.message)}};async function load(){const [o,i]=await Promise.all([api('/api/admin/fard/organizations'),api('/api/admin/fard/incidents')]);O=o.organizations||[];I=i.incidents||[];renderO();renderI()}
function renderO(){orgs.innerHTML=O.length?O.map(x=>'<article class="item"><div><span class="badge '+(x.status==='pending'?'gold':'')+'">'+esc(x.status)+'</span> <span class="badge">'+esc(x.verifier_status)+'</span></div><h3>'+esc(x.name)+'</h3><p>'+esc(x.org_type)+' · '+esc(x.area)+'<br>Scopes: '+esc((x.service_scopes||[]).join(', ')||'all')+'</p><div class="private">'+esc(x.representative)+' · '+esc(x.contact_method)+': '+esc(x.contact_value)+'</div><div class="actions"><button class="btn" onclick="orgAct(\''+x.id+'\',\'approved\',\'active\')">Approve & activate</button><button class="btn warn" onclick="orgAct(\''+x.id+'\',\'suspended\',\'suspended\')">Suspend</button><button class="btn danger" onclick="orgAct(\''+x.id+'\',\'rejected\',\'revoked\')">Reject/revoke</button></div></article>').join(''):'<p class="muted">No organisation applications.</p>'}
async function orgAct(id,status,verifier_status){try{await api('/api/admin/fard/organizations/'+id,{method:'PATCH',body:JSON.stringify({status,verifier_status})});await load()}catch(e){note(e.message)}}
function renderI(){incs.innerHTML=I.length?I.map(x=>'<article class="item"><div><span class="badge '+(x.status==='open'?'gold':'')+'">'+esc(x.status)+'</span> <span class="badge '+(['high','critical'].includes(x.severity)?'red':'')+'">'+esc(x.severity)+'</span></div><h3>'+esc(x.ref_code)+' · '+esc(x.category)+'</h3><p>'+esc(x.details)+'</p><p class="muted">Match: '+esc(x.match_id||'none')+' · Reporter: '+esc(x.reporter_type)+'</p><div class="actions"><button class="btn secondary" onclick="incAct(\''+x.id+'\',\'reviewing\',\'none\')">Reviewing</button><button class="btn" onclick="incAct(\''+x.id+'\',\'resolved\',\'resume_match\')">Resolve & resume</button><button class="btn warn" onclick="incAct(\''+x.id+'\',\'resolved\',\'cancel_match\')">Resolve & cancel match</button><button class="btn danger" onclick="incAct(\''+x.id+'\',\'resolved\',\'suspend_volunteer\')">Suspend volunteer</button><button class="btn secondary" onclick="incAct(\''+x.id+'\',\'dismissed\',\'resume_match\')">Dismiss report</button></div></article>').join(''):'<p class="muted">No safeguarding incidents.</p>'}
async function incAct(id,status,action){const notes=prompt('Admin note (optional):')||'';try{await api('/api/admin/fard/incidents/'+id,{method:'PATCH',body:JSON.stringify({status,action,notes})});await load()}catch(e){note(e.message)}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');orgPanel.classList.toggle('hide',b.dataset.tab!=='org');incPanel.classList.toggle('hide',b.dataset.tab!=='inc')});if(T)connect.click();
</script></body></html>
